name: dbt_workshop
version: "1.0.0"
config-version: 2

profile: dbt_workshop

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - target
  - dbt_packages

vars:
  # Set this once for the shared workshop GCS bucket, without the gs:// prefix.
  raw_bucket: "REPLACE_ME"

models:
  dbt_workshop:
    bronze:
      +materialized: view
      +schema: bronze
    silver:
      +materialized: view
      +schema: silver
    gold:
      +materialized: table
      +schema: gold

seeds:
  dbt_workshop:
    +quote_columns: false
