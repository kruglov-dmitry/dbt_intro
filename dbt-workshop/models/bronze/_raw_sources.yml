version: 2

sources:
  - name: raw
    description: External table over data in GCS
    schema: "{{ target.schema }}"
    config:
      freshness:
        warn_after: {count: 2, period: day}
        error_after: {count: 7, period: day}
      loaded_at_field: "timestamp(dt)"
    tables:
      - name: instruments
        identifier: instruments_external
        description: >
          Hive-partitioned upstream instrument records. The dt partition is the
          arrival date used for source freshness and incremental reprocessing.
        columns:
          - name: instrumentId
            description: Upstream string identifier; Bronze casts it to INT64.
          - name: instrumentName
            description: Upstream instrument name with surrounding whitespace.
          - name: currencyCode
            description: Upstream lowercase ISO currency code.
          - name: exchangeCode
            description: Upstream lowercase exchange code.
          - name: effectiveAt
            description: Upstream business-effective timestamp, stored as a string.
          - name: sourceUpdatedAt
            description: Upstream record-update timestamp, stored as a string.
          - name: dt
            description: Hive-derived arrival-date partition.
