[project]
name = "dbt-intro"
version = "0.1.0"
description = "Dummy data generator for the dbt Core workshop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=17,<23",
    "typer>=0.12,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
